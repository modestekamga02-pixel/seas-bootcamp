name: Build and Deploy
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm test
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
