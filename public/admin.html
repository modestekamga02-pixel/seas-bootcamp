<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootcamp Administration Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 40px;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background-color: #06b6d4;
            color: #ffffff;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        tr:hover {
            background-color: #1e293bcf;
        }
        .btn-back {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 24px;
            background-color: #0284c7;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn-back:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <h1>Bootcamp Administration Dashboard</h1>
    <p>View and manage all registered student records below.</p>

    <table>
        <thead>
            <tr>
                <th>Student Name</th>
                <th>Email Address</th>
                <th>Role</th>
                <th>Level</th>
                <th>Specialty</th>
            </tr>
        </thead>
        <tbody id="adminTableBody">
            <tr>
                <td colspan="5" style="text-align:center; color:#94a3b8;">Loading registrations...</td>
            </tr>
        </tbody>
    </table>

    <a href="index.html" class="btn-back">Back to Website</a>

    <script>
        async function fetchParticipants() {
            try {
                const response = await fetch('/api/participants');
                if (!response.ok) throw new Error('Failed to fetch data');
                
                const participants = await response.json();
                const tableBody = document.getElementById('adminTableBody');
                tableBody.innerHTML = ''; 

                if (!participants || participants.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8;">No real records found in database.</td></tr>`;
                    return;
                }

                participants.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${user.full_name || 'N/A'}</td>
                        <td>${user.email || 'N/A'}</td>
                        <td>${user.role || 'N/A'}</td>
                        <td>${user.level || 'N/A'}</td>
                        <td>${user.specialty || 'N/A'}</td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching dynamic data:', error);
                document.getElementById('adminTableBody').innerHTML = 
                    `<tr><td colspan="5" style="text-align:center; color:#f87171;">Error loading database data. Check server.</td></tr>`;
            }
        }

        window.onload = fetchParticipants;
    </script>
</body>
</html>
