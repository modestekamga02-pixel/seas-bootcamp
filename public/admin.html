<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | SEAS Bootcamp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans antialiased">

    <div class="min-h-screen flex flex-col">
        <header class="bg-indigo-900 text-white shadow-md px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-black tracking-wider uppercase">SEAS Bootcamp Admin Panel</h1>
            <a href="/" class="text-indigo-200 hover:text-white transition text-sm"><i class="fas fa-sign-out-alt"></i> Public Portal</a>
        </header>

        <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
            <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
                <div class="p-6 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                    <div>
                        <h2 class="text-lg font-bold text-slate-900 uppercase">Verify Entry Pools Table</h2>
                        <p class="text-slate-500 text-xs">Live tracking record database files from the registration endpoint.</p>
                    </div>
                    <button onclick="clearAllEntries()" class="bg-red-600 hover:bg-red-700 text-white font-mono text-xs uppercase px-4 py-2 rounded-lg transition shadow-md flex items-center gap-1">
                        <i class="fas fa-trash-alt"></i> Clear Data Records
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-700 font-mono text-[11px] uppercase tracking-wider border-b border-slate-200">
                                <th class="p-4">Full Name</th>
                                <th class="p-4">Profile Role</th>
                                <th class="p-4">Email Address</th>
                                <th class="p-4">Program</th>
                                <th class="p-4">Level</th>
                                <th class="p-4">Specialty</th>
                                <th class="p-4">Phone Number</th>
                            </tr>
                        </thead>
                        <tbody id="entriesTableBody" class="divide-y divide-slate-100 text-sm text-slate-800">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        async function fetchDashboardEntries() {
            try {
                const response = await fetch('/api/participants');
                const data = await response.json();
                const tbody = document.getElementById('entriesTableBody');
                tbody.innerHTML = '';

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center font-mono text-xs text-slate-400">No data records found in backend server.</td></tr>`;
                    return;
                }

                data.forEach(entry => {
                    const row = document.createElement('tr');
                    row.className = "hover:bg-slate-50 transition";
                    row.innerHTML = `
                        <td class="p-4 font-bold text-slate-900">${entry.full_name || 'N/A'}</td>
                        <td class="p-4"><span class="px-2 py-1 text-xs font-mono rounded bg-indigo-50 border border-indigo-200 text-indigo-700">${entry.user_type || 'N/A'}</span></td>
                        <td class="p-4 font-mono text-xs text-slate-600">${entry.email || 'N/A'}</td>
                        <td class="p-4">${entry.program || 'N/A'}</td>
                        <td class="p-4 font-mono">${entry.level || 'N/A'}</td>
                        <td class="p-4"><span class="px-2 py-0.5 font-mono text-xs rounded bg-slate-100 text-slate-700">${entry.specialty || 'N/A'}</span></td>
                        <td class="p-4 font-mono text-xs">${entry.phone || 'N/A'}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error("Failed to load pool dashboard:", err);
            }
        }

        async function clearAllEntries() {
            if (!confirm("Are you absolutely sure you want to completely wipe all database history records?")) return;
            try {
                const response = await fetch('/api/clear', { method: 'DELETE' });
                if (response.ok) {
                    fetchDashboardEntries();
                } else {
                    alert("Failed to clear entries.");
                }
            } catch (err) {
                alert("Error communicating with server: " + err.message);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchDashboardEntries);
    </script>
</body>
</html>
