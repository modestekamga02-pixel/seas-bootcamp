<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAS Admin Core - Dashboard Workspace</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--bg-secondary); padding-bottom: 1rem; }
        h1 { font-size: 1.8rem; color: #fff; display: flex; align-items: center; gap: 0.5rem; }
        h1 span { color: var(--accent-blue); }
        
        /* Navigation Links Integration */
        .nav-links { display: flex; gap: 1.2rem; align-items: center; margin-right: 1.5rem; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 0.4rem; transition: color 0.2s; }
        .nav-links a:hover { color: var(--accent-blue); }

        .btn { background: var(--bg-secondary); color: var(--text-main); border: 1px solid #334155; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.2s; font-weight: 500; }
        .btn:hover { background: #334155; transform: translateY(-1px); }
        .btn-blue { background: var(--accent-blue); border: none; }
        .btn-blue:hover { background: #2563eb; }
        .btn-green { background: var(--accent-green); border: none; }
        .btn-green:hover { background: #059669; }
        .btn-red { background: var(--accent-red); border: none; }
        .btn-red:hover { background: #dc2626; }
        
        .action-bar { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        
        .table-container { background: var(--bg-secondary); border-radius: 8px; border: 1px solid #334155; overflow-x: auto; margin-bottom: 2rem; padding: 1rem; }
        .table-title-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 0.5rem; }
        th, td { padding: 0.8rem 1rem; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        th { background-color: #111827; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
        td[contenteditable="true"] { background: rgba(59, 130, 246, 0.05); border-radius: 4px; outline: none; }
        td[contenteditable="true"]:focus { background: rgba(59, 130, 246, 0.15); border: 1px solid var(--accent-blue); }
        
        /* Modal Popup Workspace overlays */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); z-index: 1000; justify-content: center; align-items: center; padding: 1rem; }
        .modal-content { background: var(--bg-secondary); border: 1px solid #475569; width: 100%; max-width: 1100px; height: 85vh; border-radius: 12px; display: flex; flex-direction: column; padding: 1.5rem; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }
        .modal-body { flex: 1; overflow-y: auto; padding: 0.5rem 0; }
        
        .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .badge-student { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .badge-staff { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    </style>
    <script>
        // --- SECURE SESSION GUARD ENGINE ---
        function runAdminSessionSecurityCheck() {
            if (sessionStorage.getItem('seas_admin_authenticated') !== 'true') {
                executeTerminalLockAuthentication();
            }
        }

        function executeTerminalLockAuthentication() {
            const entryPassphrase = prompt("🔐 SEAS Protected Infrastructure Area\nPlease provide your core workspace administrative credential password:");
            if (entryPassphrase === "SEAS2026_ADMIN") {
                sessionStorage.setItem('seas_admin_authenticated', 'true');
            } else {
                alert("❌ Access Denied: Incorrect administrative security payload authorization.");
                window.location.href = "index.html"; 
            }
        }

        function logoutSession() {
            sessionStorage.removeItem('seas_admin_authenticated');
            alert("🔒 Admin terminal security container cleared. Redirecting to home layers...");
            window.location.href = "index.html";
        }

        // Initialize defensive guard structures immediately before DOM assembly parsing loops
        runAdminSessionSecurityCheck();
    </script>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-sliders"></i> SEAS Dashboard <span>Workspace Matrix</span></h1>
        <div style="display: flex; align-items: center;">
            <!-- Functional Public Direct Relational Anchors -->
            <nav class="nav-links">
                <a href="index.html"><i class="fa-solid fa-house-chimney"></i> Home Page</a>
                <a href="phases.html"><i class="fa-solid fa-chart-pie"></i> Phases Portal</a>
            </nav>
            <button class="btn btn-red" onclick="logoutSession()"><i class="fa-solid fa-power-off"></i> Lock Terminal</button>
        </div>
    </header>

    <div class="action-bar">
        <button class="btn btn-blue" onclick="openWorkspaceModal('groups')"><i class="fa-solid fa-people-group"></i> Create "Groups & Assign Projects"</button>
        <button class="btn btn-blue" onclick="openWorkspaceModal('phases')"><i class="fa-solid fa-calendar-days"></i> BOOTCAMP Phases</button>
    </div>

    <div class="table-container">
        <div class="table-title-area">
            <h3><i class="fa-solid fa-user-shield"></i> Registered Participants Pool (Fully Editable Grid)</h3>
            <div style="display: flex; gap: 0.5rem;">
                <button class="btn btn-green" onclick="addBlankParticipantRow()"><i class="fa-solid fa-plus"></i> Add Person Manually</button>
                <button class="btn btn-blue" onclick="saveParticipantEdits()"><i class="fa-solid fa-floppy-disk"></i> Save Grid Changes</button>
            </div>
        </div>
        <table id="mainParticipantsTable">
            <thead>
                <tr>
                    <th>Full Name</th>
                    <th>Email Address</th>
                    <th>User Role Type</th>
                    <th>Program Level</th>
                    <th>Level</th>
                    <th>Specialty</th>
                    <th>Phone Contact</th>
                    <th style="width: 80px; text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody id="participantsGridBody">
            </tbody>
        </table>
    </div>

    <div id="workspaceModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Workspace Engine</h2>
                <button class="btn" onclick="closeWorkspaceModal()"><i class="fa-solid fa-xmark"></i> Close</button>
            </div>
            <div class="action-bar" id="modalActionBar">
            </div>
            <div class="modal-body">
                <div class="table-container" style="background: #111827;">
                    <table id="workspaceDynamicTable">
                        <thead id="workspaceThead"></thead>
                        <tbody id="workspaceTbody"></tbody>
                    </table>
                </div>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem; border-top: 1px solid #334155; padding-top: 1rem;">
                <button class="btn" onclick="closeWorkspaceModal()">Cancel</button>
                <button class="btn btn-green" id="modalPublishBtn">Publish Changes Live</button>
            </div>
        </div>
    </div>

    <script>
        let currentLoadedParticipants = [];
        let activeWorkspaceType = ''; 
        let workspaceState = { headers: [], rows: [] };

        async function fetchMainData() {
            try {
                const res = await fetch('/api/participants');
                currentLoadedParticipants = await res.json();
                renderMainGrid();
            } catch (err) { alert("Session connection error fetching databases."); }
        }

        function renderMainGrid() {
            const tbody = document.getElementById('participantsGridBody');
            tbody.innerHTML = '';
            currentLoadedParticipants.forEach((person, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td contenteditable="true" onblur="updateLocalParticipantMemory(${index}, 'full_name', this.innerText)">${person.full_name || ''}</td>
                    <td contenteditable="true" onblur="updateLocalParticipantMemory(${index}, 'email', this.innerText)">${person.email || ''}</td>
                    <td contenteditable="true" onblur="updateLocalParticipantMemory(${index}, 'user_type', this.innerText)">${person.user_type || ''}</td>
                    <td contenteditable="true" onblur="updateLocalParticipantMemory(${index}, 'program', this.innerText)">${person.program || 'N/A'}</td>
                    <td contenteditable="true" onblur="updateLocalParticipantMemory(${index}, 'level', this.innerText)">${person.level || 'N/A'}</td>
                    <td contenteditable="true" onblur="updateLocalParticipantMemory(${index}, 'specialty', this.innerText)">${person.specialty || 'N/A'}</td>
                    <td contenteditable="true" onblur="updateLocalParticipantMemory(${index}, 'phone', this.innerText)">${person.phone || ''}</td>
                    <td style="text-align:center;"><button class="btn btn-red" style="padding: 0.3rem 0.6rem;" onclick="removeParticipantRow(${index})"><i class="fa-solid fa-trash-can"></i></button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateLocalParticipantMemory(index, key, text) {
            if(currentLoadedParticipants[index]) currentLoadedParticipants[index][key] = text.trim();
        }

        function addBlankParticipantRow() {
            currentLoadedParticipants.push({ full_name: 'New Person', email: 'edit@email.com', user_type: 'Student', program: 'N/A', level: 'N/A', specialty: 'N/A', phone: '00000000' });
            renderMainGrid();
        }

        function removeParticipantRow(index) {
            if(confirm("Are you sure you want to drop this individual from the registration pool matrix row manually?")) {
                currentLoadedParticipants.splice(index, 1);
                renderMainGrid();
            }
        }

        async function saveParticipantEdits() {
            try {
                const res = await fetch('/api/participants', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentLoadedParticipants)
                });
                if(res.ok) alert("Main registered master spreadsheet data synced successfully!");
            } catch(e) { alert("Failed to commit changes database array parameters to server filesystem storage."); }
        }

        async function openWorkspaceModal(type) {
            activeWorkspaceType = type;
            const modal = document.getElementById('workspaceModal');
            const mTitle = document.getElementById('modalTitle');
            const mActionBar = document.getElementById('modalActionBar');
            const pubBtn = document.getElementById('modalPublishBtn');
            
            modal.style.display = 'flex';
            mActionBar.innerHTML = `
                <button class="btn btn-blue" onclick="addCustomWorkspaceColumn()"><i class="fa-solid fa-table-columns"></i> Add Column</button>
                <button class="btn btn-blue" onclick="addCustomWorkspaceRow()"><i class="fa-solid fa-plus"></i> Add New Empty Row</button>
            `;

            if(type === 'groups') {
                mTitle.innerText = 'Create Groups & Assign Collaborative Projects Matrix';
                pubBtn.onclick = () => publishWorkspaceData('/api/groups/publish');
                
                const res = await fetch('/api/groups');
                workspaceState = await res.json();
                
                if(workspaceState.rows.length === 0) {
                    workspaceState.headers = ["Group Identifier", "Assigned Project Challenge Title", "Assigned Member Names List"];
                    const onlyStudents = currentLoadedParticipants.filter(p => p.user_type.toLowerCase().includes('stud'));
                    onlyStudents.forEach(st => {
                        workspaceState.rows.push(["Group Alpha", "Design Cloud App Architecture Challenge", st.full_name]);
                    });
                }
                mActionBar.insertAdjacentHTML('beforeend', `<button class="btn btn-green" onclick="importOnlyStudentsToScratchpad()"><i class="fa-solid fa-file-import"></i> Re-Import Active Students Only</button>`);
            } else {
                mTitle.innerText = 'Configure Bootcamp Milestone Phases & Active Timeline Calenders';
                pubBtn.onclick = () => publishWorkspaceData('/api/phases/publish');
                
                const res = await fetch('/api/phases');
                workspaceState = await res.json();
                if(workspaceState.rows.length === 0) {
                    workspaceState.headers = ["Bootcamp Phase Stage", "Task Descriptions & Target Activities", "Allocated Operational Duration Window"];
                    workspaceState.rows.push(["Phase 1: Initial Launch", "Deployment of registration pipelines and collection parameters.", "Weeks 1 - 2"]);
                    workspaceState.rows.push(["Phase 2: Project Architecture", "Forming collaborative groups and launching containerized workspaces.", "Weeks 3 - 4"]);
                }
            }
            renderWorkspaceTable();
        }

        function renderWorkspaceTable() {
            const thead = document.getElementById('workspaceThead');
            const tbody = document.getElementById('workspaceTbody');
            thead.innerHTML = '';
            tbody.innerHTML = '';

            const hTr = document.createElement('tr');
            workspaceState.headers.forEach((h, hIdx) => {
                const th = document.createElement('th');
                th.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:0.5rem;">
                        <span contenteditable="true" onblur="workspaceState.headers[${hIdx}]=this.innerText.trim()">${h}</span>
                        <i class="fa-solid fa-trash" style="cursor:pointer; color:var(--accent-red); font-size:0.75rem;" onclick="removeWorkspaceCol(${hIdx})"></i>
                    </div>
                `;
                hTr.appendChild(th);
            });
            const actionTh = document.createElement('th');
            actionTh.innerText = "Drop Row";
            actionTh.style.width = "70px";
            hTr.appendChild(actionTh);
            thead.appendChild(hTr);

            workspaceState.rows.forEach((row, rIdx) => {
                const tr = document.createElement('tr');
                row.forEach((cell, cIdx) => {
                    const td = document.createElement('td');
                    td.contentEditable = "true";
                    td.innerText = cell;
                    td.onblur = () => { workspaceState.rows[rIdx][cIdx] = td.innerText.trim(); };
                    tr.appendChild(td);
                });
                const actionTd = document.createElement('td');
                actionTd.style.textAlign = 'center';
                actionTd.innerHTML = `<i class="fa-solid fa-circle-minus" style="cursor:pointer; color:var(--accent-red);" onclick="removeWorkspaceRow(${rIdx})"></i>`;
                tr.appendChild(actionTd);
                tbody.appendChild(tr);
            });
        }

        function addCustomWorkspaceColumn() {
            workspaceState.headers.push("New Customizable Parameter Column");
            workspaceState.rows.forEach(r => r.push("Editable Data Field"));
            renderWorkspaceTable();
        }

        function addCustomWorkspaceRow() {
            const blankRow = Array(workspaceState.headers.length).fill("Editable Data Row Entry");
            workspaceState.rows.push(blankRow);
            renderWorkspaceTable();
        }

        function removeWorkspaceCol(idx) {
            workspaceState.headers.splice(idx, 1);
            workspaceState.rows.forEach(r => r.splice(idx, 1));
            renderWorkspaceTable();
        }

        function removeWorkspaceRow(idx) {
            workspaceState.rows.splice(idx, 1);
            renderWorkspaceTable();
        }

        function importOnlyStudentsToScratchpad() {
            workspaceState.rows = [];
            const onlyStudents = currentLoadedParticipants.filter(p => p.user_type.toLowerCase().includes('stud'));
            onlyStudents.forEach(st => {
                workspaceState.rows.push(["Group Unassigned", "Assign Project Title Here", st.full_name]);
            });
            renderWorkspaceTable();
        }

        async function publishWorkspaceData(endpoint) {
            try {
                workspaceState.published = true;
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(workspaceState)
                });
                if(res.ok) {
                    alert("Data published successfully! It is now visible on the public dashboard timeline views immediately.");
                    closeWorkspaceModal();
                }
            } catch(e) { alert("Failed to post target modifications to production servers filesystem matrices."); }
        }

        function closeWorkspaceModal() { document.getElementById('workspaceModal').style.display = 'none'; }

        window.onload = fetchMainData;
    </script>
</body>
</html>
