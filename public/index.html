<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAS Project Showcase | Skills Presentation</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .logo-area {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        nav a {
            color: #94a3b8;
            text-decoration: none;
            margin-left: 20px;
            font-size: 16px;
        }
        nav a:hover, nav a.active {
            color: #38bdf8;
        }
        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }
        .section-title {
            font-size: 32px;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .section-subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }
        form {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            text-align: left;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #94a3b8;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background-color: #ffffff;
            color: #0f172a;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        select:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }
        button.btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #06b6d4;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }
        button.btn-submit:hover {
            background-color: #0891b2;
        }
        #message {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
        footer {
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <span>🌐</span> SEAS Showcase
        </div>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="admin.html">Admin Dashboard</a>
        </nav>
    </header>

    <div class="container">
        <h2 class="section-title">Join the Ceremony</h2>
        <p class="section-subtitle">Mixed multi-disciplinary teams will be assigned across presentation phases.</p>

        <form id="ceremonyForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="username@institution.edu">
            </div>

            <div class="form-group">
                <label for="program">Academic Program</label>
                <select id="program" required>
                    <option value="" disabled selected>Select your program...</option>
                    <option value="BEng">BEng (4-Year Engineering)</option>
                    <option value="BTech">BTech (3-Year Technology)</option>
                    <option value="BSc">BSc (Management/Digital)</option>
                    <option value="BHSc">BHSc (Health Sciences)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="level">Assigned Level</label>
                <select id="level" required disabled>
                    <option value="" disabled selected>Select program first...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="specialty">Specialty Code</label>
                <select id="specialty" required disabled>
                    <option value="" disabled selected>Select program first...</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Confirm Participation</button>
            <p id="message"></p>
        </form>
    </div>

    <footer>
        © 2026 SEAS Bootcamp - Mixed Specialty Multi-Phase Iterative Platform
    </footer>

    <script>
        // Implements your strict bootcamp mapping logic criteria
        const operationalRules = {
            "BEng": { level: "Level 3", specialties: ["CSE", "CEE", "EME", "CHE"] },
            "BTech": { level: "Level 2", specialties: ["CSE", "EEE", "MCT", "MEC"] },
            "BSc": { level: "Level 2", specialties: ["MGT", "MIS", "AF", "DMK"] },
            "BHSc": { level: "Level 3", specialties: ["BMS", "NUR"] }
        };

        const programSelect = document.getElementById('program');
        const levelSelect = document.getElementById('level');
        const specialtySelect = document.getElementById('specialty');

        programSelect.addEventListener('change', function() {
            const selectedProgram = this.value;
            const rules = operationalRules[selectedProgram];

            if (rules) {
                // Set and lock the specific required level automatically
                levelSelect.innerHTML = `<option value="${rules.level}">${rules.level}</option>`;
                levelSelect.disabled = false;

                // Populate only the valid specialties allowed for that level program
                specialtySelect.innerHTML = '<option value="" disabled selected>Choose Specialty...</option>';
                rules.specialties.forEach(spec => {
                    specialtySelect.innerHTML += `<option value="${spec}">${spec}</option>`;
                });
                specialtySelect.disabled = false;
            }
        });

        document.getElementById('ceremonyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageElement = document.getElementById('message');
            
            const data = {
                full_name: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                role: `Student (${programSelect.value})`,
                level: levelSelect.value,
                specialty: specialtySelect.value
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (response.ok) {
                    messageElement.style.color = '#34d399';
                    messageElement.textContent = 'Participation confirmed successfully!';
                    document.getElementById('ceremonyForm').reset();
                    levelSelect.disabled = true;
                    specialtySelect.disabled = true;
                } else {
                    messageElement.style.color = '#f87171';
                    messageElement.textContent = result.error || 'Registration failed.';
                }
            } catch (err) {
                messageElement.style.color = '#f87171';
                messageElement.textContent = 'Error communicating with cloud server.';
            }
        });
    </script>
</body>
</html>
