<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAS Bootcamp - Welcome</title>
    <style>
        :root {
            --primary: #0A2540;
            --accent: #635BFF;
            --bg: #F8F9FA;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .hero-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 520px;
            text-align: center;
        }
        .logo-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            gap: 20px;
        }
        .logo-container img {
            height: 65px;
            object-fit: contain;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            color: var(--primary);
            font-weight: 700;
        }
        p {
            font-size: 15px;
            color: #4F566B;
            line-height: 1.6;
            margin-bottom: 35px;
            text-align: justify;
        }
        .btn-register {
            display: inline-block;
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            transition: background 0.2s;
            box-sizing: border-box;
            border: none;
            cursor: pointer;
        }
        .btn-register:hover {
            background: #4B45E5;
        }
    </style>
</head>
<body>

<div class="hero-card">
    <!-- Institutional Branding Headers -->
    <div class="logo-container">
        <img src="/assets/iuc-logo.png" alt="IUC Logo" onerror="this.src='iuc-logo.png'">
        <img src="/assets/seas-logo.png" alt="SEAS Logo" onerror="this.src='seas-logo.png'">
    </div>

    <h1>Welcome to SEAS Bootcamp</h1>
    
    <p>Empowering students across all specialities. Join your multidisciplinary engineering groups, collaborate through multiple design project development phases, and present your final innovations to expert juries and corporate partners.</p>
    
    <a href="/register.html" class="btn-register">Register</a>
</div>

</body>
</html>
