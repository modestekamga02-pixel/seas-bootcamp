<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAS Bootcamp - Home Platform</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; }
        
        /* Navigation Header */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: var(--bg-secondary); border-bottom: 1px solid #334155; }
        .logo { font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; }
        .logo span { color: var(--accent-blue); }
        .nav-links { display: flex; gap: 1.5rem; list-style: none; align-items: center; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: #fff; }
        .btn-admin { background: var(--accent-blue); color: white !important; padding: 0.4rem 1rem; border-radius: 6px; font-weight: 500; }

        .hero { text-align: center; padding: 4rem 1rem; max-width: 800px; margin: 0 auto; }
        .hero h1 { font-size: 2.5rem; margin-bottom: 1rem; color: #fff; }
        .hero h1 span { color: var(--accent-blue); }
        .hero p { color: var(--text-muted); font-size: 1.1rem; line-height: 1.6; }

        .container { max-width: 600px; margin: 0 auto 4rem auto; padding: 0 1rem; }
        
        /* Form Card */
        .form-card { background: var(--bg-secondary); padding: 2rem; border-radius: 8px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .form-card h2 { margin-bottom: 1.5rem; font-size: 1.4rem; display: flex; align-items: center; gap: 0.5rem; color: #fff; }
        .form-card h2 span { color: var(--accent-green); }
        
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
        .form-group input, .form-group select { width: 100%; padding: 0.65rem; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent-blue); }
        
        .btn-submit { width: 100%; background: var(--accent-green); color: #fff; border: none; padding: 0.75rem; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 0.5rem; transition: background 0.2s; }
        .btn-submit:hover { background: #059669; }
        
        .msg { margin-top: 1rem; padding: 0.75rem; border-radius: 6px; font-size: 0.9rem; display: none; text-align: center; }
        .msg-success { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .msg-error { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><i class="fa-solid fa-graduation-cap"></i> SEAS <span>Bootcamp 2025–2026</span></div>
        <ul class="nav-links">
            <li><a href="/" class="active">Home</a></li>
            <li><a href="/phases.html">Phases & Grouping</a></li>
            <li><a href="/admin.html" class="btn-admin">Admin Panel</a></li>
        </ul>
    </nav>

    <section class="hero">
        <h1>Welcome to <span>SEAS Bootcamp</span> Workspace</h1>
        <p>Register below to join the cloud hosting and engineering sandbox. Track live project groupings and milestone roadmap phases directly via the dashboard panels.</p>
    </section>

    <div class="container">
        <div class="form-card">
            <h2><i class="fa-solid fa-id-card"></i> Candidate <span>Registration Form</span></h2>
            
            <form id="registrationForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="full_name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>User Profile Type</label>
                    <select id="user_type" required>
                        <option value="Student">Student Candidate</option>
                        <option value="Jury">Jury / Instructor Personnel</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Program Path</label>
                    <input type="text" id="program" placeholder="e.g., Cloud Computing" value="Cloud Computing">
                </div>
                <div class="form-group">
                    <label>Level</label>
                    <input type="text" id="level" placeholder="e.g., Professional License" value="Professional License">
                </div>
                <div class="form-group">
                    <label>Specialty Track</label>
                    <input type="text" id="specialty" placeholder="e.g., DevOps / Infrastructure">
                </div>
                <div class="form-group">
                    <label>Phone Contact</label>
                    <input type="text" id="phone" required placeholder="e.g., 677000000">
                </div>
                
                <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> Submit Registration</button>
                <div id="formMsg" class="msg"></div>
            </form>
        </div>
    </div>

    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const msgBox = document.getElementById('formMsg');
            msgBox.style.display = 'none';

            const payload = {
                full_name: document.getElementById('full_name').value.trim(),
                email: document.getElementById('email').value.trim(),
                user_type: document.getElementById('user_type').value,
                program: document.getElementById('program').value.trim() || "N/A",
                level: document.getElementById('level').value.trim() || "N/A",
                specialty: document.getElementById('specialty').value.trim() || "N/A",
                phone: document.getElementById('phone').value.trim()
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    msgBox.className = "msg msg-success";
                    msgBox.innerHTML = `<i class="fa-solid fa-circle-check"></i> Registration successful!`;
                    msgBox.style.display = 'block';
                    document.getElementById('registrationForm').reset();
                } else {
                    throw new Error(result.error || "Failed registration processing validation.");
                }
            } catch (err) {
                msgBox.className = "msg msg-error";
                msgBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Error: ${err.message}`;
                msgBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
