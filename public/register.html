<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Portal | SEAS Bootcamp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-900 antialiased font-sans min-h-screen flex flex-col justify-between">

    <nav class="bg-white shadow-sm w-full border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="/assets/iuc-logo.png" alt="IUC Logo" onerror="this.src='iuc-logo.png'" class="h-9 w-auto object-contain">
                <img src="/assets/seas-logo.png" alt="SEAS Logo" onerror="this.src='seas-logo.png'" class="h-9 w-auto object-contain">
                <span class="text-sm font-bold tracking-tight text-slate-800">SEAS Registration Portal</span>
            </div>
            <a href="/" class="text-slate-600 hover:text-indigo-600 font-semibold text-sm transition flex items-center gap-1.5">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </nav>

    <main class="py-12 px-4 sm:px-6 lg:px-8 flex-grow flex items-center justify-center">
        <div class="max-w-2xl w-full">
            <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-10 border border-slate-100" id="portalContainer">
                <div class="text-center mb-8" id="portalHeader">
                    <h2 class="text-3xl font-bold text-slate-900 tracking-tight">Registration Portal</h2>
                    <p class="mt-2 text-sm text-slate-600">Provide your authenticated details to log into the infrastructure environment database.</p>
                </div>
                
                <form id="bootcampForm" class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-770 uppercase tracking-wider mb-1.5"><i class="fas fa-user text-slate-400 mr-1"></i> Full Name</label>
                        <input type="text" id="fullName" required placeholder="e.g., Modeste-K" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none text-sm text-slate-900 bg-white">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-770 uppercase tracking-wider mb-1.5"><i class="fas fa-envelope text-slate-400 mr-1"></i> Email Address</label>
                        <input type="email" id="email" required placeholder="username@example.com" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none text-sm text-slate-900 bg-white">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-770 uppercase tracking-wider mb-1.5"><i class="fas fa-user-tag text-slate-400 mr-1"></i> I am a...</label>
                            <select id="userType" required class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none text-sm text-slate-700 bg-white">
                                <option value="student">Student</option>
                                <option value="teacher">Teacher / Instructor</option>
                                <option value="jury">Jury Member</option>
                                <option value="staff">SEAS Administration Staff</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-770 uppercase tracking-wider mb-1.5"><i class="fas fa-graduation-cap text-slate-400 mr-1"></i> Program</label>
                            <select id="program" required class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none text-sm text-slate-700 bg-white">
                                <option value="">-- Select --</option>
                                <option value="B.Eng">B.Eng</option>
                                <option value="B.Tech">B.Tech</option>
                                <option value="B.Sc">B.Sc</option>
                                <option value="B.HSc">B.HSc</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-770 uppercase tracking-wider mb-1.5"><i class="fas fa-signal text-slate-400 mr-1"></i> Year Level</label>
                            <select id="level" required disabled class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none text-sm text-slate-700 bg-white disabled:bg-slate-50 disabled:cursor-not-allowed">
                                <option value="">-- Choose Program First --</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-770 uppercase tracking-wider mb-1.5"><i class="fas fa-microscope text-slate-400 mr-1"></i> Specialty</label>
                            <select id="specialty" required disabled class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none text-sm text-slate-700 bg-white disabled:bg-slate-50 disabled:cursor-not-allowed">
                                <option value="">-- Choose Program First --</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-770 uppercase tracking-wider mb-1.5"><i class="fas fa-phone text-slate-400 mr-1"></i> Phone Number <span class="text-slate-400 font-normal lowercase">(optional)</span></label>
                        <input type="tel" id="phone" placeholder="+237 6xx xxx xxx" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition outline-none text-sm text-slate-900 bg-white">
                    </div>

                    <button type="submit" class="w-full mt-2 bg-indigo-600 text-white font-bold py-3.5 rounded-lg hover:bg-indigo-700 transition shadow-lg shadow-indigo-600/10 flex items-center justify-center gap-2 text-sm sm:text-base">
                        <i class="fas fa-check-circle"></i> Confirm Registration
                    </button>
                    <div id="formFeedback" class="p-3.5 rounded-lg text-sm font-medium text-center hidden border"></div>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-xs border-t border-slate-800">
        &copy; 2026 SEAS Bootcamp — IUC Douala. All rights reserved.
    </footer>

    <script>
        const dataMatrix = {
            "B.Eng": { levels: ["Level 3"], specialties: ["CSE", "CEE", "EME", "CHE"] },
            "B.Tech": { levels: ["Level 2"], specialties: ["CSE", "EEE", "MCT", "MEC"] },
            "B.Sc": { levels: ["Level 2"], specialties: ["MGT", "MIS", "AF", "DMK"] },
            "B.HSc": { levels: ["BMS3", "NUR3"], specialties: ["BMS", "NUR"] }
        };

        const programSelect = document.getElementById('program');
        const levelSelect = document.getElementById('level');
        const specialtySelect = document.getElementById('specialty');
        const form = document.getElementById('bootcampForm');
        const feedback = document.getElementById('formFeedback');
        const container = document.getElementById('portalContainer');

        programSelect.addEventListener('change', function() {
            const prog = this.value;
            levelSelect.innerHTML = '<option value="">-- Select Level --</option>';
            specialtySelect.innerHTML = '<option value="">-- Select Specialty --</option>';
            
            if (prog && dataMatrix[prog]) {
                levelSelect.disabled = false;
                specialtySelect.disabled = false;
                dataMatrix[prog].levels.forEach(lvl => {
                    const opt = document.createElement('option');
                    opt.value = lvl; opt.textContent = lvl;
                    levelSelect.appendChild(opt);
                });
                dataMatrix[prog].specialties.forEach(spec => {
                    const opt = document.createElement('option');
                    opt.value = spec; opt.textContent = spec;
                    specialtySelect.appendChild(opt);
                });
            } else {
                levelSelect.disabled = true;
                specialtySelect.disabled = true;
                levelSelect.innerHTML = '<option value="">-- Choose Program First --</option>';
                specialtySelect.innerHTML = '<option value="">-- Choose Program First --</option>';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            feedback.className = "p-3.5 rounded-lg text-sm font-medium text-center hidden border";
            feedback.style.display = "none";

            const payload = {
                full_name: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                user_type: document.getElementById('userType').value,
                program: programSelect.value,
                level: levelSelect.value,
                specialty: specialtySelect.value,
                phone: document.getElementById('phone').value
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (response.ok && result.success) {
                    // Inject a professional success screen state matching your exact description
                    container.innerHTML = `
                        <div class="text-center py-8 px-4 space-y-6">
                            <div class="inline-flex items-center justify-center w-20 h-20 bg-green-50 text-green-500 rounded-full border border-green-100 text-4xl shadow-sm">
                                <i class="fas fa-check-circle"></i>
                            </div>
                            <div class="space-y-2">
                                <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900">Registration Successful!</h2>
                                <p class="text-sm sm:text-base text-slate-600 max-w-md mx-auto">
                                    Hello <span class="font-bold text-slate-900">${payload.full_name}</span>, your registration profile has been successfully committed to the SEAS infrastructure database.
                                </p>
                            </div>
                            <div class="bg-slate-50 border border-slate-100 p-4 rounded-xl text-left text-xs space-y-1.5 max-w-sm mx-auto font-mono text-slate-600">
                                <div><span class="font-bold text-slate-700">Track:</span> ${payload.program} - ${payload.specialty}</div>
                                <div><span class="font-bold text-slate-700">Class Level:</span> ${payload.level}</div>
                                <div><span class="font-bold text-slate-700">Database Email:</span> ${payload.email}</div>
                            </div>
                            <p class="text-xs text-slate-400">A validation protocol configuration link has been dispatched to your email address.</p>
                            <div class="pt-4">
                                <a href="/" class="inline-flex items-center gap-2 bg-indigo-600 text-white font-bold px-6 py-3 rounded-lg shadow-md shadow-indigo-600/10 hover:bg-indigo-700 transition text-sm">
                                    <i class="fas fa-home"></i> Return to Homepage
                                </a>
                            </div>
                        </div>
                    `;
                </div> else {
                    throw new Error(result.error || "An infrastructure error occurred during enrollment routing.");
                }
            } catch (err) {
                feedback.className = "p-3.5 rounded-lg text-sm font-medium text-center border bg-red-50 text-red-700 border-red-200 block";
                feedback.textContent = err.message;
            }
        });
    </script>
</body>
</html>
