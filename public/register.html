<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Portal | SEAS Bootcamp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-white text-slate-900 font-sans min-h-screen">

    <nav class="border-b border-slate-200 h-16 flex items-center px-8">
        <a href="/" class="text-slate-500 hover:text-indigo-600 text-xs font-bold flex items-center gap-2">
            <i class="fas fa-arrow-left"></i> BACK TO HOME
        </a>
    </nav>

    <main class="max-w-xl mx-auto py-12 px-4">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black text-indigo-600 uppercase">Registration Portal</h1>
        </div>

        <form id="registrationForm" onsubmit="handleRegistrationSubmit(event)" class="space-y-6">
            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase">Full Name</label>
                <input type="text" id="fullName" required class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:border-indigo-500 outline-none">
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase">Email</label>
                <input type="email" id="email" required class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:border-indigo-500 outline-none">
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase">I Am A...</label>
                <select id="userType" onchange="updateFormFields()" class="w-full border border-slate-300 rounded-lg p-3 text-sm outline-none">
                    <option value="Student">Student</option>
                    <option value="Teacher / Instructor">Teacher / Instructor</option>
                    <option value="Jury Member">Jury Member</option>
                    <option value="SEAS Administration Staff">SEAS Administration Staff</option>
                </select>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase">Program</label>
                    <select id="program" onchange="updateFormFields()" class="w-full border border-slate-300 rounded-lg p-3 text-sm outline-none">
                        <option value="Beng3">Beng</option>
                        <option value="BTECH2">Btech</option>
                        <option value="BSc2">BSc</option>
                        <option value="BHSc">BHSc</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase">Year Level</label>
                    <select id="level" class="w-full border border-slate-300 rounded-lg p-3 text-sm outline-none"></select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-500 uppercase">Specialty</label>
                    <select id="specialty" class="w-full border border-slate-300 rounded-lg p-3 text-sm outline-none"></select>
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-lg uppercase text-xs tracking-widest hover:bg-indigo-700">Confirm Registration</button>
        </form>
    </main>

    <script>
        const academicMapping = {
            "Beng3": { levels: ["3"], specialties: ["CSE", "CEE", "EME", "CHE"] },
            "BTECH2": { levels: ["2"], specialties: ["CSE", "EEE", "MCT", "MEC"] },
            "BSc2": { levels: ["2"], specialties: ["MGT", "MIS", "AF", "DMK"] },
            "BHSc": { levels: ["3"], specialties: ["BMS3", "NUR3"] }
        };

        function updateFormFields() {
            const role = document.getElementById('userType').value;
            const prog = document.getElementById('program');
            const lvl = document.getElementById('level');
            const spec = document.getElementById('specialty');

            if (role !== "Student") {
                prog.disabled = lvl.disabled = spec.disabled = true;
                lvl.innerHTML = '<option>N/A</option>';
                spec.innerHTML = '<option>N/A</option>';
            } else {
                prog.disabled = lvl.disabled = spec.disabled = false;
                const config = academicMapping[prog.value];
                lvl.innerHTML = config.levels.map(l => `<option value="${l}">${l}</option>`).join('');
                spec.innerHTML = config.specialties.map(s => `<option value="${s}">${s}</option>`).join('');
            }
        }

        async function handleRegistrationSubmit(e) {
            e.preventDefault();
            const data = {
                full_name: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                user_type: document.getElementById('userType').value,
                program: document.getElementById('program').value,
                level: document.getElementById('level').value,
                specialty: document.getElementById('specialty').value
            };
            const res = await fetch('/api/register', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            if (res.ok) { alert("Registration Successful!"); window.location.href = '/'; }
        }

        document.addEventListener('DOMContentLoaded', updateFormFields);
    </script>
</body>
</html>
