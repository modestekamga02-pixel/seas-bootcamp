<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Portal | SEAS Bootcamp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-white text-slate-900 antialiased font-sans min-h-screen flex flex-col justify-between">

    <nav class="bg-slate-50 border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <img src="/assets/iuc-logo.png" alt="IUC Logo" onerror="this.src='iuc-logo.png'" class="h-9 w-auto object-contain">
                    <img src="/assets/seas-logo.png" alt="SEAS Logo" onerror="this.src='seas-logo.png'" class="h-9 w-auto object-contain">
                </div>
                <a href="/" class="text-slate-500 hover:text-slate-900 font-medium text-xs transition flex items-center gap-1">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-xl mx-auto w-full px-4 py-12 flex-grow flex items-center justify-center">
        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-8 shadow-xl w-full relative">
            
            <div id="successModal" class="hidden absolute inset-0 bg-white/95 rounded-2xl z-50 flex flex-col items-center justify-center p-6 text-center space-y-4">
                <div class="w-16 h-16 bg-emerald-100 border border-emerald-300 text-emerald-600 rounded-full flex items-center justify-center text-3xl shadow shadow-emerald-200 animate-bounce">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h2 class="text-xl font-extrabold text-slate-900">Registration Successful!</h2>
            </div>

            <div class="text-center mb-8">
                <h1 class="text-2xl font-black text-indigo-600 tracking-tight uppercase">Registration Portal</h1>
            </div>

            <form id="registrationForm" onsubmit="handleRegistrationSubmit(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-mono uppercase tracking-wider text-slate-600 mb-1.5 font-bold">Full Name</label>
                    <input type="text" id="fullName" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-mono uppercase tracking-wider text-slate-600 mb-1.5 font-bold">Email Address</label>
                    <input type="email" id="email" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-mono uppercase tracking-wider text-slate-600 mb-1.5 font-bold">I Am A...</label>
                        <select id="userType" onchange="handleRoleAndProgramChange()" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm">
                            <option value="Student">Student</option>
                            <option value="Teacher / Instructor">Teacher / Instructor</option>
                            <option value="Jury Member">Jury Member</option>
                            <option value="SEAS Administration Staff">SEAS Administration Staff</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-mono uppercase tracking-wider text-slate-600 mb-1.5 font-bold">Program</label>
                        <select id="program" onchange="handleRoleAndProgramChange()" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm">
                            <option value="Beng">Beng</option>
                            <option value="Btech">Btech</option>
                            <option value="BSc">BSc</option>
                            <option value="BHSc">BHSc</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-mono uppercase tracking-wider text-slate-600 mb-1.5 font-bold">Year Level</label>
                        <select id="level" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-mono uppercase tracking-wider text-slate-600 mb-1.5 font-bold">Specialty</label>
                        <select id="specialty" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm"></select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-mono uppercase tracking-wider text-slate-600 mb-1.5 font-bold">Phone Number</label>
                    <input type="text" id="phone" required class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm">
                </div>

                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-xl text-xs uppercase tracking-wider">Confirm Registration</button>
            </form>
        </div>
    </main>

    <script>
        const eligibilityMap = {
            "Beng": { levels: ["3"], specialties: ["CSE", "CEE", "EME", "CHE"] },
            "Btech": { levels: ["2"], specialties: ["CSE", "EEE", "MCT", "MEC"] },
            "BSc": { levels: ["2"], specialties: ["MGT", "MIS", "AF", "DMK"] },
            "BHSc": { levels: ["3"], specialties: ["BMS3", "NUR3"] }
        };

        function handleRoleAndProgramChange() {
            const role = document.getElementById('userType').value;
            const prog = document.getElementById('program');
            const lvl = document.getElementById('level');
            const spec = document.getElementById('specialty');

            if (role !== "Student") {
                prog.disabled = lvl.disabled = spec.disabled = true;
                lvl.innerHTML = '<option>N/A</option>';
                spec.innerHTML = '<option>N/A</option>';
            } else {
                prog.disabled = lvl.disabled = spec.disabled = false;
                const rule = eligibilityMap[prog.value];
                lvl.innerHTML = rule.levels.map(l => `<option value="${l}">${l}</option>`).join('');
                spec.innerHTML = rule.specialties.map(s => `<option value="${s}">${s}</option>`).join('');
            }
        }

        async function handleRegistrationSubmit(e) {
            e.preventDefault();
            const role = document.getElementById('userType').value;
            const payload = {
                full_name: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                user_type: role,
                program: role === "Student" ? document.getElementById('program').value : "N/A",
                level: role === "Student" ? document.getElementById('level').value : "N/A",
                specialty: role === "Student" ? document.getElementById('specialty').value : "N/A",
                phone: document.getElementById('phone').value
            };
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (response.ok) { document.getElementById('successModal').classList.remove('hidden'); setTimeout(() => window.location.replace('/'), 3000); }
        }
        
        document.addEventListener('DOMContentLoaded', handleRoleAndProgramChange);
    </script>
</body>
</html>
