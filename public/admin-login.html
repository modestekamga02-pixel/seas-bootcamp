<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | SEAS Bootcamp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen antialiased">

    <div class="bg-slate-950 p-8 rounded-2xl shadow-2xl border border-slate-800 w-full max-w-sm mx-4">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 rounded-xl flex items-center justify-center text-xl mx-auto mb-3 shadow-inner">
                <i class="fas fa-lock"></i>
            </div>
            <h1 class="text-xl font-black text-white uppercase tracking-tight">Restricted Access</h1>
            <p class="text-slate-400 text-xs mt-1">SEAS Central Monitoring Core Authentication</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-[10px] font-mono font-bold text-slate-500 uppercase tracking-wider mb-1">Administrative Master Key</label>
                <input type="password" id="adminPassword" class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg px-4 py-2.5 text-sm outline-none focus:border-indigo-500 transition font-mono" placeholder="••••••••">
            </div>
            
            <button onclick="verifyCredentials()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-lg shadow-indigo-900/40 font-mono uppercase tracking-wider">
                Unlock Dashboard
            </button>
        </div>
    </div>

    <script>
        async function verifyCredentials() {
            const password = document.getElementById('adminPassword').value;
            
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    window.location.replace('/admin.html');
                } else {
                    alert("Unauthorized Access: Invalid Credentials");
                }
            } catch (err) {
                alert("Connection disruption: " + err.message);
            }
        }

        // Allow pressing Enter key to submit login
        document.getElementById('adminPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyCredentials();
        });
    </script>
</body>
</html>
