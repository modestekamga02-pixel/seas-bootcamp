<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAS Admin Portal Authentication</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 360px; width: 100%; }
        h2 { color: #1e293b; margin-bottom: 8px; }
        p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
        input[type="password"] { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; box-sizing: border-box; text-align: center; }
        input[type="password"]:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        button { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; cursor: pointer; width: 100%; font-weight: 6px; }
        button:hover { background: #1d4ed8; }
        .error-message { color: #dc2626; margin-top: 12px; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>SEAS Admin Core</h2>
        <p>Enter password to unlock dashboard tracking matrix</p>
        <input type="password" id="passwordInput" placeholder="Enter Administrative Password" onkeypress="if(event.key === 'Enter') handleLogin()">
        <button onclick="handleLogin()">Unlock Interface</button>
        <div id="errorMsg" class="error-message">Incorrect password credentials. Access denied.</div>
    </div>

    <script>
        function handleLogin() {
            const password = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');
            
            fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // Password accepted! Redirect directly to the secure dashboard page
                    window.location.href = '/admin.html';
                } else {
                    errorMsg.style.display = 'block';
                }
            })
            .catch(err => {
                console.error("Authentication handshake error:", err);
            });
        }
    </script>
</body>
</html>
